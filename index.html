<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Loop Visualizer</title>
  </head>
  <body>
      <div class="event-loop-container">
        <div class="label-container">
          <h3>Call Stack</h3>
          <div class="callstack-container"></div>
        </div>
        <div class="label-container">
          <h3>Microtasks</h3>
          <div class="microtask-container"></div>
        </div>
        <div class="label-container">
          <h3>Macrotasks</h3>
          <div class="macrotask-container"></div>
        </div>
      </div>
      <div class="javascript-code-area">
        <div class="javascript-code-area-content">console.log('1')</div>
        <div class="javascript-code-area-content">setTimeout(() => console.log('2'), 0)</div>
        <div class="javascript-code-area-content">Promise.resolve().then(() => console.log('3'))</div>
        <div class="javascript-code-area-content">queueMicrotask(() => console.log('4'))</div>
        <div class="javascript-code-area-content">console.log('5')</div>
      </div>
      <button id="button">Run</button>
    <script src="script.js"></script>
  </body>
</html>
